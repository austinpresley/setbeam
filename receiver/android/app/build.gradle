plugins {
    id 'com.android.application'
}

android {
    namespace 'com.setbeam.receiver'
    compileSdk 36

    defaultConfig {
        applicationId 'com.setbeam.receiver'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.1'
        ndk {
            // Google TV / Android TV devices, including 32-bit-userspace boxes. The
            // pinned WebRTC AAR also ships x86 and x86_64; they are left out of the APK.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // The release APK is unsigned until a private signing key is configured outside Git.
        disable 'ExpiredTargetSdkVersion'
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // Native WebRTC for Android, pinned. Provenance, checksums, and licenses:
    // receiver/docs/native-dependencies.md
    implementation 'io.github.webrtc-sdk:android:144.7559.15'

    testImplementation 'junit:junit:4.13.2'
    // org.json ships with Android; JVM unit tests need a real implementation.
    testImplementation 'org.json:json:20250517'
}
