<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101012"><title>Setbeam</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-volume-x" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4zM17 9l5 6m0-6-5 6"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
<symbol id="i-max" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol><symbol id="i-min" viewBox="0 0 24 24"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m18 0h-5v5"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3m0 4h.01"/></symbol><symbol id="i-pip" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><rect x="11" y="12" width="8" height="6" rx=".5" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14" stroke-width="3"/></symbol><symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></symbol><symbol id="i-end" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol><symbol id="i-link-off" viewBox="0 0 24 24"><path d="m9 15 6-6M10 6l1-1a5 5 0 0 1 7 7l-1 1M7 11l-1 1a5 5 0 0 0 7 7l1-1M3 3l18 18"/></symbol>

<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol></defs></svg>
<main id="player" class="player" aria-label="Feed player">
<header><h1 id="title">Feed</h1><div class="badges"><span id="sample" class="sample" hidden>Sample</span><div class="state connecting" id="state" role="status" aria-live="polite">Connecting</div></div></header>
<div class="picture" id="picture"><video id="video" autoplay playsinline muted aria-label="Shared feed"></video><div class="slate" id="slate"><svg class="icon slate-symbol" aria-hidden="true"><use id="slate-icon" href="#i-loader"/></svg><strong id="slate-title" class="sr-only">Connecting to the feed</strong><span id="slate-copy">Waiting for the picture.</span><button id="retry" class="play-button" type="button" aria-label="Play feed" title="Play feed" hidden><svg class="icon" aria-hidden="true"><use id="retry-icon" href="#i-play"/></svg></button></div></div>
<div class="controls"><div class="control-group"><button id="sound" class="icon-button" type="button" aria-label="Unmute" title="Unmute" aria-pressed="false" disabled hidden><svg class="icon" aria-hidden="true"><use id="sound-icon" href="#i-volume-x"/></svg></button></div><div class="control-group"><button id="help" class="icon-button" type="button" aria-label="Connection help" title="Connection help" aria-expanded="false" aria-controls="help-panel"><svg class="icon" aria-hidden="true"><use id="help-icon" href="#i-help"/></svg></button><button id="awake" class="icon-button" type="button" aria-label="Keep screen on" title="Keep screen on" aria-pressed="false"><svg class="icon" aria-hidden="true"><use id="awake-icon" href="#i-sun"/></svg></button><button id="pip" class="icon-button" type="button" aria-label="Picture in picture" title="Picture in picture" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use id="pip-icon" href="#i-pip"/></svg></button><button id="fullscreen" class="icon-button" type="button" aria-label="Enter full screen" title="Enter full screen" ><svg class="icon" aria-hidden="true"><use id="fullscreen-icon" href="#i-max"/></svg></button></div></div>
<aside class="help-panel" id="help-panel" aria-label="Connection help" hidden><p id="network-hint">Stay on the same network as the operator.</p><p>Keep this page open if the picture is interrupted.</p><p><kbd>M</kbd> Sound <span class="shortcut"><kbd>F</kbd> Full screen</span><br>Double-click the picture for full screen.</p></aside>
<video id="keepawake" class="keepawake" muted playsinline loop aria-hidden="true" tabindex="-1"></video>
</main><script src="reader.js"></script><script src="keepawake.js"></script><script src="viewer.js"></script>
</body></html>
